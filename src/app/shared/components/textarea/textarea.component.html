<textarea
  [placeholder]="placeholder"
  [rows]="rows"
  [disabled]="disabled"
  [value]="value"
  (input)="onInput($event)"
  (blur)="onBlur()"
  class="w-full px-3.5 py-2.5 text-sm border border-zinc-200 rounded-xl text-zinc-900 placeholder-zinc-300 bg-white focus:outline-none focus:border-zinc-400 focus:ring-2 focus:ring-zinc-100 transition-colors resize-none disabled:opacity-50 disabled:cursor-not-allowed"
></textarea>
