<label class="flex items-center gap-3 cursor-pointer w-fit" [class.opacity-50]="disabled" [class.cursor-not-allowed]="disabled">
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked"
    [disabled]="disabled"
    (click)="toggle()"
    class="relative w-10 h-5 rounded-full transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:ring-offset-1"
    [class.bg-zinc-900]="checked"
    [class.bg-zinc-200]="!checked"
  >
    <span
      class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200"
      [class.translate-x-5]="checked"
    ></span>
  </button>
  @if (label) {
    <span class="text-sm font-medium text-zinc-700 select-none">{{ label }}</span>
  }
</label>
