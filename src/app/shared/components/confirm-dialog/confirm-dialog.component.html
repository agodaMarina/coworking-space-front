<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/20 backdrop-blur-[1px]" (click)="cancelled.emit()"></div>

  <div class="relative z-10 w-full max-w-sm mx-4 bg-white rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-6 pt-6 pb-5">
      <div class="w-10 h-10 rounded-xl bg-[#FBCBE3] flex items-center justify-center mb-4">
        <span class="iconify text-zinc-800" data-icon="lucide:trash-2" data-width="18"></span>
      </div>
      <h3 class="text-base font-semibold text-zinc-900 mb-1">{{ title }}</h3>
      <p class="text-sm text-zinc-500">{{ message }}</p>
    </div>

    <div class="px-6 pb-6 flex items-center justify-end gap-3">
      <button
        (click)="cancelled.emit()"
        class="px-4 py-2 text-sm font-medium text-zinc-600 hover:text-zinc-900 transition-colors">
        Cancel
      </button>
      <button
        (click)="confirmed.emit()"
        class="px-4 py-2 rounded-lg bg-zinc-900 text-white text-sm font-medium hover:bg-zinc-700 transition-colors">
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
