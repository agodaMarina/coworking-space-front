<nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-zinc-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-5 h-20 flex items-center justify-between">
        <a href="#" class="flex items-center">
            <span class="text-2xl font-bold tracking-tight text-black">Cowork</span>
        </a>

        <div class="hidden md:flex items-center gap-10">
            <div class="flex items-center gap-8">
                <a routerLink="/home" class="text-sm font-medium text-zinc-600 hover:text-black transition-colors">Accueil</a>
                <a routerLink="/spaces" class="text-sm font-medium text-zinc-600 hover:text-black transition-colors">Espaces</a>
                <a routerLink="/blog" class="text-sm font-medium text-zinc-600 hover:text-black transition-colors">Blog</a>
                <a routerLink="/events" class="text-sm font-medium text-zinc-600 hover:text-black transition-colors">Contact</a>
            </div>

            <div class="h-6 w-px bg-zinc-200 mx-2"></div>
            <div class="flex items-center gap-3">
                @if (isAuthenticated()) {
                    <a routerLink="/dashboard" class="text-sm font-bold px-7 py-3 rounded-full border border-black text-black hover:bg-zinc-50 transition-all">
                        Dashboard
                    </a>
                    <button (click)="logout()" class="text-sm font-bold px-7 py-3 rounded-full bg-black text-white hover:bg-zinc-800 transition-all">
                        Déconnexion
                    </button>
                } @else {
                    <a routerLink="/login" class="text-sm font-bold px-7 py-3 rounded-full border border-black text-black hover:bg-zinc-50 transition-all">
                        Se connecter
                    </a>
                    <a routerLink="/register" class="text-sm font-bold px-7 py-3 rounded-full bg-black text-white hover:bg-zinc-800 transition-all">
                        S'inscrire
                    </a>
                }
            </div>
        </div>

        <button (click)="toggleMenu()" class="md:hidden text-black p-1">
            <span class="iconify" data-icon="lucide:menu" data-width="24"></span>
        </button>
    </div>
</nav>

<div class="fixed inset-0 z-[60] bg-white transition-transform duration-300 md:hidden flex flex-col"
     [class.translate-x-full]="!isMobileMenuOpen"
     [class.translate-x-0]="isMobileMenuOpen">

    <div class="flex items-center justify-between px-5 h-20 border-b border-zinc-100">
        <span class="text-xl font-bold">Cowork</span>
        <button (click)="closeMenu()" class="text-black p-1">
            <span class="iconify" data-icon="lucide:x" data-width="24"></span>
        </button>
    </div>

    <div class="flex-1 flex flex-col justify-center px-8 gap-8">
        <a routerLink="/home" (click)="closeMenu()" class="text-4xl font-bold text-black hover:text-zinc-500 transition-colors">Accueil</a>
        <a routerLink="/pricing" (click)="closeMenu()" class="text-4xl font-bold text-black hover:text-zinc-500 transition-colors">Espaces</a>
        <a routerLink="/blog" (click)="closeMenu()" class="text-4xl font-bold text-black hover:text-zinc-500 transition-colors">Blog</a>
        <a routerLink="/events" (click)="closeMenu()" class="text-4xl font-bold text-black hover:text-zinc-500 transition-colors">Contact</a>
    </div>

    <div class="p-8 flex flex-col gap-4">
        <a routerLink="/login" class="w-full text-center font-bold py-4 rounded-full border border-black text-black">Se connecter</a>
        <a routerLink="/register" class="w-full text-center font-bold py-4 rounded-full bg-black text-white">S'inscrire</a>
    </div>
</div>
