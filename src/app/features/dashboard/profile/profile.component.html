<div class="min-h-full bg-white">

  <!-- Header -->
  <div class="px-8 pt-10 pb-8 border-b border-zinc-100">
    <p class="text-xs font-medium text-zinc-400 mb-1">Dashboard</p>
    <h1 class="text-2xl font-semibold text-zinc-900 tracking-tight">Profile</h1>
  </div>

  <div class="px-8 py-8 max-w-lg">

    <!-- Avatar + name -->
    <div class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-xl bg-[#AEE9F4] flex items-center justify-center text-zinc-900 text-sm font-bold flex-shrink-0">
        {{ userInitials() }}
      </div>
      <div>
        <p class="text-base font-semibold text-zinc-900">{{ user()?.name }}</p>
        <p class="text-sm text-zinc-400">{{ user()?.email }}</p>
      </div>
    </div>

    <!-- Fields -->
    <div class="border border-zinc-100 rounded-xl overflow-hidden mb-6">
      <div class="grid grid-cols-[140px_1fr] items-center px-5 py-3.5 border-b border-zinc-100 hover:bg-zinc-50/50 transition-colors">
        <p class="text-sm text-zinc-400">Full name</p>
        <p class="text-sm font-medium text-zinc-900">{{ user()?.name ?? '—' }}</p>
      </div>
      <div class="grid grid-cols-[140px_1fr] items-center px-5 py-3.5 border-b border-zinc-100 hover:bg-zinc-50/50 transition-colors">
        <p class="text-sm text-zinc-400">Email</p>
        <p class="text-sm font-medium text-zinc-900">{{ user()?.email ?? '—' }}</p>
      </div>
      <div class="grid grid-cols-[140px_1fr] items-center px-5 py-3.5 hover:bg-zinc-50/50 transition-colors">
        <p class="text-sm text-zinc-400">Member ID</p>
        <p class="text-sm font-mono text-zinc-400">#{{ user()?.id ?? '—' }}</p>
      </div>
    </div>

    <p class="text-xs text-zinc-400">
      To update your profile, contact
      <a href="mailto:support@coworking.com" class="underline underline-offset-2 hover:text-zinc-700 transition-colors">support@coworking.com</a>.
    </p>

  </div>
</div>
