<main class="relative z-10 flex flex-col lg:flex-row items-center justify-between px-6 lg:px-16 xl:px-24 pt-8 lg:pt-4 pb-16 min-h-[calc(100vh-80px)]">

        <!-- Left Content -->
        <div class="flex-1 max-w-lg lg:max-w-xl z-10 text-center lg:text-left">
            <!-- 404 Badge -->
            <div class="inline-flex items-center gap-2 bg-red-50 text-brand px-4 py-2 rounded-full mb-6">
                <span class="w-2 h-2 bg-brand rounded-full pulse-soft"></span>
                <span class="text-xs font-semibold uppercase tracking-widest">Error 404</span>
            </div>

            <!-- Heading -->
            <h1 class="text-4xl sm:text-5xl lg:text-[3.5rem] xl:text-[4rem] font-extrabold text-dark leading-[1.1] tracking-tight mb-6">
                Ooops...<br/>
                <span class="text-brand">Page not found</span>
            </h1>

            <!-- Description -->
            <p class="text-muted text-base lg:text-lg leading-relaxed mb-10 max-w-md mx-auto lg:mx-0">
                A massa, interdum pretium, ut sit est nec. Convallis fames proin lacus cras.
            </p>

            <!-- CTA Button -->
            <a href="#" class="inline-flex items-center gap-2.5 bg-brand hover:bg-brand-dark text-white font-semibold text-sm px-8 py-4 rounded-xl shadow-lg shadow-red-200 hover:shadow-xl hover:shadow-red-300 transition-all duration-300 group">
                Go Back
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </a>

            <!-- Subtle Stats -->
            <div class="flex items-center gap-8 mt-12 justify-center lg:justify-start">
                <div>
                    <p class="text-2xl font-bold text-dark">24/7</p>
                    <p class="text-xs text-muted mt-0.5">Support</p>
                </div>
                <div class="w-px h-10 bg-gray-200"></div>
                <div>
                    <p class="text-2xl font-bold text-dark">99.9%</p>
                    <p class="text-xs text-muted mt-0.5">Uptime</p>
                </div>
                <div class="w-px h-10 bg-gray-200"></div>
                <div>
                    <p class="text-2xl font-bold text-dark">Fast</p>
                    <p class="text-xs text-muted mt-0.5">Recovery</p>
                </div>
            </div>
        </div>

        <!-- Right Illustration -->
        <div class="flex-1 flex items-center justify-center relative mt-10 lg:mt-0">
            <svg viewBox="0 0 600 500" class="w-full max-w-xl lg:max-w-2xl" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Background decorative circles -->
                <circle cx="300" cy="250" r="200" fill="#FFF1F2" opacity="0.7"/>
                <circle cx="300" cy="250" r="160" fill="#FFE4E6" opacity="0.4"/>
                <circle cx="180" cy="130" r="50" fill="#FECDD3" opacity="0.5" class="float-anim"/>
                <circle cx="460" cy="160" r="30" fill="#FECDD3" opacity="0.4" class="float-anim-slow"/>
                <circle cx="420" cy="400" r="40" fill="#FFE4E6" opacity="0.5" class="float-anim"/>
                <circle cx="140" cy="370" r="25" fill="#FECDD3" opacity="0.3" class="float-anim-slow"/>

                <!-- Dashed decorative lines -->
                <line x1="80" y1="200" x2="80" y2="350" stroke="#F9A8B8" stroke-width="2" stroke-dasharray="8 6" class="dash-anim" opacity="0.5"/>
                <line x1="520" y1="100" x2="520" y2="280" stroke="#F9A8B8" stroke-width="2" stroke-dasharray="8 6" class="dash-anim" opacity="0.5"/>
                <line x1="200" y1="420" x2="380" y2="420" stroke="#F9A8B8" stroke-width="2" stroke-dasharray="8 6" class="dash-anim" opacity="0.4"/>

                <!-- Plant outline (left) -->
                <g opacity="0.35" transform="translate(60, 300)">
                    <path d="M20 120 C20 80, 20 60, 20 40" stroke="#34D399" stroke-width="2.5" fill="none"/>
                    <path d="M20 70 C0 55, -5 35, 10 25" stroke="#34D399" stroke-width="2" fill="none"/>
                    <path d="M20 55 C40 40, 45 20, 30 12" stroke="#34D399" stroke-width="2" fill="none"/>
                    <path d="M20 90 C-5 75, -15 55, 5 48" stroke="#34D399" stroke-width="2" fill="none"/>
                    <ellipse cx="8" cy="23" rx="10" ry="6" fill="#D1FAE5" transform="rotate(-30 8 23)"/>
                    <ellipse cx="32" cy="10" rx="10" ry="6" fill="#D1FAE5" transform="rotate(25 32 10)"/>
                    <ellipse cx="3" cy="46" rx="10" ry="6" fill="#D1FAE5" transform="rotate(-20 3 46)"/>
                </g>

                <!-- Plant outline (right) -->
                <g opacity="0.3" transform="translate(500, 280)">
                    <path d="M20 140 C20 100, 20 70, 20 50" stroke="#34D399" stroke-width="2.5" fill="none"/>
                    <path d="M20 80 C45 65, 50 45, 35 35" stroke="#34D399" stroke-width="2" fill="none"/>
                    <path d="M20 60 C-5 45, -10 25, 8 18" stroke="#34D399" stroke-width="2" fill="none"/>
                    <ellipse cx="37" cy="33" rx="10" ry="6" fill="#D1FAE5" transform="rotate(30 37 33)"/>
                    <ellipse cx="6" cy="16" rx="10" ry="6" fill="#D1FAE5" transform="rotate(-25 6 16)"/>
                </g>

                <!-- Large 404 Text -->
                <text x="300" y="200" text-anchor="middle" font-family="'Playfair Display', serif" font-size="120" font-weight="900" fill="#FEE2E2">404</text>
                <text x="300" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E63946" letter-spacing="3">PAGE NOT FOUND</text>

                <!-- Power strip / Outlet -->
                <g transform="translate(200, 260)">
                    <!-- Strip body -->
                    <rect x="30" y="40" width="140" height="50" rx="12" fill="#374151" stroke="#4B5563" stroke-width="2"/>
                    <!-- Socket holes -->
                    <circle cx="70" cy="65" r="8" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
                    <circle cx="70" cy="65" r="3" fill="#374151"/>
                    <circle cx="130" cy="65" r="8" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
                    <circle cx="130" cy="65" r="3" fill="#374151"/>
                    <!-- Cord from strip -->
                    <path d="M170 65 C190 65, 210 55, 230 50" stroke="#4B5563" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Small plug at end -->
                    <rect x="225" y="42" width="18" height="16" rx="3" fill="#374151" stroke="#6B7280" stroke-width="1.5"/>
                    <rect x="230" y="38" width="3" height="6" rx="1" fill="#9CA3AF"/>
                    <rect x="237" y="38" width="3" height="6" rx="1" fill="#9CA3AF"/>
                </g>

                <!-- Left Person -->
                <g transform="translate(155, 220)" class="float-anim-slow">
                    <!-- Head -->
                    <circle cx="40" cy="25" r="18" fill="#FDDCB5"/>
                    <!-- Hair -->
                    <path d="M22 20 C22 8, 35 2, 42 5 C49 2, 60 8, 60 20 C60 15, 55 10, 42 10 C29 10, 22 15, 22 20Z" fill="#1F2937"/>
                    <!-- Eyes -->
                    <circle cx="34" cy="26" r="2" fill="#1F2937"/>
                    <circle cx="48" cy="26" r="2" fill="#1F2937"/>
                    <!-- Mouth -->
                    <path d="M36 33 C38 36, 44 36, 46 33" stroke="#C2775E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <!-- Body -->
                    <rect x="25" y="43" width="30" height="45" rx="8" fill="#E63946"/>
                    <!-- Arms reaching toward plug -->
                    <path d="M55 55 C70 50, 80 60, 95 55" stroke="#FDDCB5" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <!-- Hand -->
                    <circle cx="97" cy="54" r="6" fill="#FDDCB5"/>
                    <!-- Legs -->
                    <rect x="28" y="85" width="10" height="25" rx="5" fill="#374151"/>
                    <rect x="42" y="85" width="10" height="25" rx="5" fill="#374151"/>
                    <!-- Shoes -->
                    <ellipse cx="33" cy="112" rx="8" ry="4" fill="#1F2937"/>
                    <ellipse cx="47" cy="112" rx="8" ry="4" fill="#1F2937"/>
                </g>

                <!-- Right Person -->
                <g transform="translate(350, 215)" class="float-anim">
                    <!-- Head -->
                    <circle cx="40" cy="25" r="18" fill="#FDDCB5"/>
                    <!-- Hair (longer, different style) -->
                    <path d="M20 22 C18 8, 30 0, 42 3 C54 0, 64 8, 62 22 C64 35, 60 42, 55 45 L58 30 C58 18, 52 10, 42 10 C32 10, 26 18, 26 30 L22 45 C18 42, 16 35, 20 22Z" fill="#92400E"/>
                    <!-- Eyes -->
                    <circle cx="34" cy="26" r="2" fill="#1F2937"/>
                    <circle cx="48" cy="26" r="2" fill="#1F2937"/>
                    <!-- Mouth (surprised) -->
                    <ellipse cx="41" cy="34" rx="3" ry="4" fill="#C2775E" opacity="0.6"/>
                    <!-- Body -->
                    <rect x="25" y="43" width="30" height="45" rx="8" fill="#3B82F6"/>
                    <!-- Arms reaching toward plug -->
                    <path d="M25 55 C10 50, 0 60, -15 55" stroke="#FDDCB5" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <!-- Hand -->
                    <circle cx="-17" cy="54" r="6" fill="#FDDCB5"/>
                    <!-- Legs -->
                    <rect x="28" y="85" width="10" height="25" rx="5" fill="#374151"/>
                    <rect x="42" y="85" width="10" height="25" rx="5" fill="#374151"/>
                    <!-- Shoes -->
                    <ellipse cx="33" cy="112" rx="8" ry="4" fill="#1F2937"/>
                    <ellipse cx="47" cy="112" rx="8" ry="4" fill="#1F2937"/>
                </g>

                <!-- Spark effects near plug area -->
                <g class="pulse-soft">
                    <line x1="260" y1="295" x2="270" y2="285" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
                    <line x1="265" y1="300" x2="275" y2="290" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
                    <line x1="255" y1="300" x2="260" y2="288" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
                </g>

                <!-- Small decorative dots -->
                <circle cx="120" cy="180" r="3" fill="#FECDD3" opacity="0.6"/>
                <circle cx="490" cy="220" r="4" fill="#FECDD3" opacity="0.5"/>
                <circle cx="450" cy="350" r="3" fill="#FECDD3" opacity="0.4"/>
                <circle cx="150" cy="400" r="3" fill="#BBF7D0" opacity="0.4"/>
                <circle cx="480" cy="130" r="2.5" fill="#FECDD3" opacity="0.5"/>

                <!-- Small cross/plus shapes -->
                <g opacity="0.3" transform="translate(100, 250)">
                    <line x1="0" y1="-6" x2="0" y2="6" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
                    <line x1="-6" y1="0" x2="6" y2="0" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
                </g>
                <g opacity="0.25" transform="translate(510, 320)">
                    <line x1="0" y1="-5" x2="0" y2="5" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
                    <line x1="-5" y1="0" x2="5" y2="0" stroke="#E63946" stroke-width="2" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
    </main>
